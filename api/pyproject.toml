[project]
name = "sheready-api"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pwdlib[argon2]>=0.3,<1.0",
    "fastapi[standard]>=0.115,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "google-genai>=1.0,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "tzdata>=2025.1",
    "httpx>=0.28,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
