services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sheready
      POSTGRES_PASSWORD: sheready
      POSTGRES_DB: sheready
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheready"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sheready:sheready@db:5432/sheready
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
